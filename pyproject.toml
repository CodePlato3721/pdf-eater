[project]
name = "pdf-eater"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
addopts = "--import-mode=prepend -m 'not smoke'"
markers = [
    "smoke: hits the real OpenAI API (costs money, needs OPENAI_API_KEY); excluded by default, run explicitly with -m smoke",
]
